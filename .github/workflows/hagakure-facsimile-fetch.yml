name: Hagakure facsimile fetch

on:
  push:
    branches:
      - agent/hagakure-facsimile-fetch
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download 1937 Sankyo Shoin facsimiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p facsimile
          base='https://commons.wikimedia.org/wiki/Special:Redirect/file'
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074360_%E8%91%89%E9%9A%A0_%E4%B8%8A_part1.pdf" -o facsimile/NDL1074360_hagakure_upper_part1.pdf
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074360_%E8%91%89%E9%9A%A0_%E4%B8%8A_part2.pdf" -o facsimile/NDL1074360_hagakure_upper_part2.pdf
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074362_%E8%91%89%E9%9A%A0_%E4%B8%AD_part1.pdf" -o facsimile/NDL1074362_hagakure_middle_part1.pdf
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074362_%E8%91%89%E9%9A%A0_%E4%B8%AD_part2.pdf" -o facsimile/NDL1074362_hagakure_middle_part2.pdf
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074364_%E8%91%89%E9%9A%A0_%E4%B8%8B_part1.pdf" -o facsimile/NDL1074364_hagakure_lower_part1.pdf
          curl -fL --retry 5 --retry-delay 2 "$base/NDL1074364_%E8%91%89%E9%9A%A0_%E4%B8%8B_part2.pdf" -o facsimile/NDL1074364_hagakure_lower_part2.pdf
          sha256sum facsimile/*.pdf | tee facsimile/SHA256SUMS.txt
          for f in facsimile/*.pdf; do pdfinfo "$f" | grep -E '^(Pages|Encrypted|Page size):' | sed "s|^|$(basename "$f") |"; done | tee facsimile/PDFINFO.txt
      - name: Upload facsimiles
        uses: actions/upload-artifact@v4
        with:
          name: hagakure-1937-facsimile-six-pdfs
          path: facsimile/
          compression-level: 0
          retention-days: 7
